server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"service":"lovekoala","status":"ok"}';
    }

    # Body bytes and signature headers are forwarded unchanged. No secret here.
    location = /api/webhooks/stripe {
        if ($request_method != POST) { return 405; }
        proxy_pass https://enhnlektomuoumozjsfp.supabase.co/functions/v1/lovekoala-api/webhook/stripe;
        proxy_set_header Host enhnlektomuoumozjsfp.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_name enhnlektomuoumozjsfp.supabase.co;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-LoveKoala-Webhook stripe always;
    }
    location = /api/webhooks/mercosulpay {
        if ($request_method != POST) { return 405; }
        proxy_pass https://enhnlektomuoumozjsfp.supabase.co/functions/v1/lovekoala-api/webhook/mercosulpay;
        proxy_set_header Host enhnlektomuoumozjsfp.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_name enhnlektomuoumozjsfp.supabase.co;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-LoveKoala-Webhook mercosulpay always;
    }
    location ^~ /api/ { return 404; }
    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1d;
    }
    location / { try_files $uri $uri/ /index.html; }
}

# EasyPanel terminates TLS; both domain entries target internal port 8080.
server {
    listen 8080;
    server_name www.lovekoala.com.br;
    return 308 https://lovekoala.com.br$request_uri;
}
